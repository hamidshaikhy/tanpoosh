            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      required:
      - product_slug
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: tp_session
      description: Server session. Unsafe requests also require X-CSRFToken from /auth/csrf.
