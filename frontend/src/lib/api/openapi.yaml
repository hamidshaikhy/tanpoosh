components:
  schemas:
    AddItemRequest:
      type: object
      properties:
        variant_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 10
          minimum: 1
          default: 1
      required:
      - variant_id
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 80
        recipient_name:
          type: string
          maxLength: 240
        phone:
          type: string
          maxLength: 20
        province:
          type: string
          maxLength: 40
        city:
          type: string
          maxLength: 60
        postal_code:
          type: string
          maxLength: 20
        line:
          type: string
          maxLength: 600
        plaque:
          type: string
          maxLength: 40
        unit:
          type: string
          maxLength: 40
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - created_at
      - id
      - line
      - phone
      - postal_code
      - province
      - recipient_name
      - updated_at
    AddressInputRequest:
      type: object
      properties:
        recipient_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
