[project]
name = "tanpoosh-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --reuse-db"
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "BLE", "C4", "SIM"]
ignore = [
    "S101",   # assert in tests
    "S105",   # false positives on "token"/"password" field names
    "S106",
    "S311",   # non-crypto random used only in seed data
    "E501",   # handled by formatter / long Persian strings
    "B904",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM"]
"config/settings/*" = ["F405", "F403"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = ["apps/.*/migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
